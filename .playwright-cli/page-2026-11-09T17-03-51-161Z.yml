                      - textbox: "# 实时文本预览器 左侧编辑，右侧即时预览，<b>所见即所得</b>。 ## Markdown 快捷解析 > 这是一段 Markdown 引用块：连续多行以 > 开头即可合并为引用样式， > 行内仍可混用 <b>加粗</b>、<color=#22C55E>颜色</color> 等富文本标签。 | 功能 | 语法 | 状态 | | :--- | :---: | ---: | | 引用块 | > 文本 | 已支持 | | 表格 | 竖线 + 分隔行 | 已支持 | | 代码块 | 三反引号围栏 | 已支持 | ```js // 代码块原样保留换行与缩进，内部不解析标签 function greet(name) { const msg = '你好, ' + name; console.log(msg); } ``` ## 高级排版 - <b>加粗</b>强调关键内容 - <i>倾斜</i>表达语气变化 - H<sub>2</sub>O 与 X<sup>3</sup> 展示上下标 - <spacing=3>宽字符间距效果</spacing> - <lh=2>更大的行距让段落呼吸</lh> ## 列表序号格式 1. 阿拉伯数字序号 i. 小写罗马数字 A. 大写字母序号 ★ 星形自定义符号 ○ 空心圆自定义符号 ## 使用提示 选中文本后点击工具栏按钮即可应用格式；「插入」菜单可一键插入表格、引用、任务列表等块级内容；预览区右上角可将排版结果导出为高清 PNG 长图。"
